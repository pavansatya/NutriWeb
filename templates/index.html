<!-- templates/index.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ingredient-Based Product Recommendation</title>
</head>
<body>
  <h1>Ingredient-Based Product Recommendation System</h1>
  <form action="{{ url_for('recommendations_page') }}" method="post">
    <label for="product_name">Enter Product Name:</label>
    <input type="text" name="product_name" id="product_name" placeholder="e.g., Farmhouse Oatmeal" required>
    <button type="submit">Search</button>
  </form>
  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}
</body>
</html>
